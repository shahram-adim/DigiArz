<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08111f">
<title>DigiArz | صرافی آزمایشی</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#08111f;
  --panel:#101d30;
  --line:#263951;
  --text:#edf4ff;
  --muted:#9eb0c8;
  --green:#16c784;
  --red:#ea5964;
  --blue:#5b9cff;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}
button,input {
  font:inherit;
}
button {
  border:0;
  border-radius:12px;
  padding:13px 16px;
  background:var(--blue);
  color:#071322;
  font-weight:bold;
}
input {
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#091626;
  color:white;
}
.wrap {
  max-width:1100px;
  margin:auto;
  padding:18px 14px;
}
.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  padding:17px;
  margin-bottom:14px;
}
.brand {
  font-size:27px;
  font-weight:900;
}
.brand span {color:var(--green)}
.muted {color:var(--muted)}
.hidden {display:none!important}
.field {margin:12px 0}
.field label {
  display:block;
  margin-bottom:7px;
  color:var(--muted);
}
.notice {
  padding:12px;
  border-radius:11px;
  background:#182b42;
  margin:12px 0;
  font-size:13px;
  line-height:1.9;
}
.auth {
  max-width:470px;
  margin:8vh auto;
}
.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.stat {
  background:#0a1727;
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
}
.value {
  font-size:20px;
  font-weight:bold;
  margin-top:9px;
  direction:ltr;
}
.tabs {
  display:flex;
  gap:8px;
  overflow:auto;
  margin:14px 0;
}
.tabs button {
  white-space:nowrap;
  background:#243951;
  color:white;
}
.coin {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  padding:13px;
  margin:8px 0;
  background:#0a1727;
  border-radius:12px;
}
.price {
  direction:ltr;
  text-align:left;
}
.buy {background:var(--green)}
.sell {background:var(--red);color:white}
.secondary {background:#243951;color:white}
.trade-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.trade-box {
  background:#0a1727;
  padding:14px;
  border-radius:13px;
}
table {width:100%;border-collapse:collapse}
td,th {
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:right;
}
@media(max-width:600px) {
  .trade-grid {grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="wrap">

<header style="display:flex;justify-content:space-between;align-items:center">
  <div>
    <div class="brand">Digi<span>Arz</span></div>
    <div class="muted">صرافی آزمایشی ارز دیجیتال</div>
  </div>
  <button id="logoutBtn" class="secondary hidden">خروج</button>
</header>

<section id="authView" class="card auth">
  <h2>ورود و ثبت‌نام</h2>
  <div class="notice">
    ورود امن با شماره موبایل و کد یک‌بارمصرف پیامکی
  </div>

  <div id="phoneStep">
    <div class="field">
      <label>شماره موبایل با کد کشور</label>
      <input id="phone" type="tel"
        placeholder="+989121234567" dir="ltr">
    </div>
    <button id="sendOtpBtn" style="width:100%">
      ارسال کد تأیید
    </button>
  </div>

  <div id="otpStep" class="hidden">
    <div class="field">
      <label>کد پیامک‌شده</label>
      <input id="otp" inputmode="numeric"
        placeholder="کد تأیید" dir="ltr">
    </div>
    <button id="verifyBtn" style="width:100%">
      تأیید و ورود
    </button>
  </div>

  <div id="authMsg" class="notice hidden"></div>
</section>

<main id="appView" class="hidden">

<section class="card">
  <h2>داشبورد DigiArz</h2>
  <div id="userPhone" class="muted"></div>

  <div class="grid" style="margin-top:15px">
    <div class="stat">
      <div class="muted">موجودی USDT</div>
      <div class="value" id="usdtBalance">—</div>
    </div>
    <div class="stat">
      <div class="muted">موجودی ریال</div>
      <div class="value" id="irrBalance">—</div>
    </div>
  </div>
</section>

<nav class="tabs">
  <button data-tab="markets">بازارها</button>
  <button data-tab="trade">خرید و فروش</button>
  <button data-tab="assets">دارایی‌ها</button>
  <button data-tab="history">تاریخچه</button>
</nav>

<section id="tab-markets" class="card">
  <h2>قیمت بازار</h2>
  <div id="marketList">در حال دریافت قیمت‌ها...</div>
</section>

<section id="tab-trade" class="card hidden">
  <h2>معاملات آزمایشی</h2>

  <div class="trade-grid">
    <div class="trade-box">
      <h3>خرید</h3>
      <input id="buySymbol" value="BTCUSDT" dir="ltr">
      <br><br>
      <input id="buyAmount" type="number"
        placeholder="مقدار خرید">
      <br><br>
      <button id="buyBtn" class="buy" style="width:100%">
        خرید آزمایشی
      </button>
    </div>

    <div class="trade-box">
      <h3>فروش</h3>
      <input id="sellSymbol" value="BTCUSDT" dir="ltr">
      <br><br>
      <input id="sellAmount" type="number"
        placeholder="مقدار فروش">
      <br><br>
      <button id="sellBtn" class="sell" style="width:100%">
        فروش آزمایشی
      </button>
    </div>
  </div>
  <div id="tradeMsg" class="notice hidden"></div>
</section>

<section id="tab-assets" class="card hidden">
  <h2>دارایی‌های من</h2>
  <div id="assetList"></div>
</section>

<section id="tab-history" class="card hidden">
  <h2>تاریخچه معاملات</h2>
  <table>
    <thead>
      <tr>
        <th>نماد</th>
        <th>نوع</th>
        <th>مقدار</th>
        <th>قیمت</th>
      </tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>
</section>

</main>
</div>
