name: Exact decimal tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  exact-decimal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digiarz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digiarz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run exact decimal and browser integration tests
        run: node --test tests/*.test.js
      - name: Run PostgreSQL arithmetic regression tests
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d digiarz_test -v ON_ERROR_STOP=1 -f supabase/tests/exact_decimal_arithmetic.sql
      - name: Compile and run isolated exact-decimal Limit worker integration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d digiarz_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/exact_decimal_limit_worker_setup.sql \
            -f supabase/drafts/2026-11-15_exact_decimal_process_limit_orders.sql \
            -f supabase/tests/exact_decimal_limit_worker_integration.sql
      - name: Compile and run isolated Limit cancellation lifecycle integration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d digiarz_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/exact_decimal_cancel_setup.sql \
            -f supabase/tests/exact_decimal_cancel_integration.sql
