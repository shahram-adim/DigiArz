name: Exact decimal tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  exact-decimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run exact decimal and browser integration tests
        run: node --test tests/*.test.js