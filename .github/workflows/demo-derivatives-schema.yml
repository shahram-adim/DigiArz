name: Demo derivatives schema tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/drafts/2026-11-18_demo_derivatives_schema.sql'
      - 'supabase/tests/demo_derivatives_*.sql'
      - '.github/workflows/demo-derivatives-schema.yml'

jobs:
  demo-derivatives-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digiarz_derivatives_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digiarz_derivatives_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated Supabase auth fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d digiarz_derivatives_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/demo_derivatives_schema_setup.sql
      - name: Apply derivatives schema draft to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d digiarz_derivatives_test -v ON_ERROR_STOP=1 \
            -f supabase/drafts/2026-11-18_demo_derivatives_schema.sql
      - name: Verify derivative tables, RLS, ledger and immutability
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d digiarz_derivatives_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/demo_derivatives_schema_integration.sql
      - name: Verify unbalanced ledger transaction is rejected
        env:
          PGPASSWORD: postgres
        run: |
          if psql -h localhost -U postgres -d digiarz_derivatives_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/demo_derivatives_ledger_unbalanced.sql \
            > /tmp/demo-derivatives-ledger-negative.log 2>&1; then
            cat /tmp/demo-derivatives-ledger-negative.log
            echo "Expected the unbalanced ledger transaction to be rejected."
            exit 1
          fi
          cat /tmp/demo-derivatives-ledger-negative.log
          if ! grep -Fq 'not balanced per asset' /tmp/demo-derivatives-ledger-negative.log; then
            echo "Ledger rejection failed for an unexpected reason."
            exit 1
          fi
