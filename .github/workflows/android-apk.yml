name: DigiArz Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - spike/android-biometric-capacitor8-2026-11-21
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon*.svg"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: digiarz-android-apk
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare Android web assets with pinned Supabase SDK
        run: npm run build:android

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify merged biometric permission
        run: |
          MANIFEST="$(find android/app/build/intermediates -type f -path '*/merged_manifest/*/processDebugMainManifest/AndroidManifest.xml' -print -quit)"
          if [[ -z "$MANIFEST" ]]; then
            echo "Merged Android manifest not found; cannot verify biometric permission." >&2
            find android/app/build/intermediates -type f -name AndroidManifest.xml -print >&2
            exit 1
          fi
          if ! grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST"; then
            echo "Merged Android manifest is missing android.permission.USE_BIOMETRIC." >&2
            cat "$MANIFEST" >&2
            exit 1
          fi
          echo "Verified android.permission.USE_BIOMETRIC in $MANIFEST"

      - name: Record APK build provenance
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          VERSION="$(node -p "require('./package.json').version || 'unspecified'")"
          {
            echo "app=DigiArz"
            echo "package_version=$VERSION"
            echo "git_commit=$GITHUB_SHA"
            echo "git_ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "apk_sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } > android/app/build/outputs/apk/debug/BUILD-INFO.txt
          cat android/app/build/outputs/apk/debug/BUILD-INFO.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiArz-Android-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        if: github.ref != 'refs/heads/spike/android-biometric-capacitor8-2026-11-21'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.run_number }}
          name: DigiArz Android Debug APK (Build ${{ github.run_number }})
          body: |
            Automatically built debug APK for commit ${{ github.sha }}.
            This is a test build, not a production-signed release.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
