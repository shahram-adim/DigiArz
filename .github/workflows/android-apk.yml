name: DigiArz Android APK
# Rebuild trigger: regenerate the debug APK from the latest independent UI branch head.
# Build requested for the synchronized independent redesign commit.

on:
  workflow_dispatch:
  push:
    branches:
      - redesign/independent-ui-2026
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon*.svg"
      - "src/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: digiarz-android-apk
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Run regression tests before APK build
        run: node --test tests/technical-analysis.test.js tests/subscription-plans.test.js tests/service-worker.test.js tests/index-syntax.test.js

      - name: Prepare web assets
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Record APK build provenance
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          VERSION="$(node -p "require('./package.json').version || 'unspecified'")"
          {
            echo "app=DigiArz"
            echo "package_version=$VERSION"
            echo "git_commit=$GITHUB_SHA"
            echo "git_ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "apk_sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } > android/app/build/outputs/apk/debug/BUILD-INFO.txt
          cat android/app/build/outputs/apk/debug/BUILD-INFO.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiArz-Android-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
