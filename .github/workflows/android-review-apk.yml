name: DigiArz Android Review APK

on:
  push:
    branches:
      - ui/restore-indigo-glass-1126-2026-11-20
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon*.svg"
      - "src/**"
      - "package.json"
      - "capacitor.config.json"
      - "tests/**"
      - ".github/workflows/android-review-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon*.svg"
      - "src/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-review-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digiarz-android-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-review-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Prepare Android web assets
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build installable review APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Record APK provenance
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          VERSION="$(node -p "require('./package.json').version || 'unspecified'")"
          {
            echo "app=DigiArz"
            echo "package_version=$VERSION"
            echo "git_commit=$GITHUB_SHA"
            echo "git_ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "apk_sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } > android/app/build/outputs/apk/debug/BUILD-INFO.txt
          cat android/app/build/outputs/apk/debug/BUILD-INFO.txt

      - name: Upload review APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: DigiArz-PR44-review-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7
