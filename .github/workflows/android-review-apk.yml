name: DigiArz Android Review APK — artifact only

on:
  workflow_dispatch:
  push:
    branches:
      - redesign/indigo-glass-layout-fix-2026-11-21
      - fix/pure-white-glass-dashboard-market-2026-11-21-v2
    paths:
      - .github/workflows/android-review-apk.yml
      - index.html
      - package.json
      - package-lock.json
      - capacitor.config.json
      - src/android-biometric-lock.js
      - scripts/inject-android-biometric.py
      - scripts/prepare-android-web.sh
      - scripts/test-android-biometric.js
      - tests/**

permissions:
  contents: read

concurrency:
  group: digiarz-safe-review-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-review-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout selected DigiArz review candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify npm package signatures
        run: npm audit signatures

      - name: Run APK biometric storage tests
        run: npm test

      - name: Run visual and application regression tests
        run: node --test tests/*.test.js

      - name: Prepare Android web assets with pinned Supabase SDK and native biometric bridge
        run: npm run build:android

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Verify Capacitor runtime is packaged
        run: |
          RUNTIME="android/app/src/main/assets/public/capacitor.js"
          test -s "$RUNTIME"
          grep -q "registerPlugin" "$RUNTIME"
          echo "Verified Capacitor native bridge: $RUNTIME"

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify merged biometric permission
        run: |
          MANIFEST="$(find android/app/build/intermediates -type f -path '*/merged_manifest/*/processDebugMainManifest/AndroidManifest.xml' -print -quit)"
          if [[ -z "$MANIFEST" ]]; then
            echo "Merged Android manifest not found; cannot verify biometric permission." >&2
            find android/app/build/intermediates -type f -name AndroidManifest.xml -print >&2
            exit 1
          fi
          grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST" || {
            echo "USE_BIOMETRIC permission missing from merged manifest." >&2
            cat "$MANIFEST" >&2
            exit 1
          }
          echo "Verified android.permission.USE_BIOMETRIC in $MANIFEST"

      - name: Record APK build provenance
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          {
            echo "app=DigiArz"
            echo "source_branch=$GITHUB_REF_NAME"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "apk_sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } > android/app/build/outputs/apk/debug/BUILD-INFO.txt
          cat android/app/build/outputs/apk/debug/BUILD-INFO.txt

      - name: Upload review APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: DigiArz-White-Glass-Review-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
