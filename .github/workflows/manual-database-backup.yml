name: DigiArz manual database backup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/manual-database-backup.yml

permissions:
  contents: read

concurrency:
  group: digiarz-manual-db-backup
  cancel-in-progress: false

jobs:
  backup-database-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_URL"
            exit 1
          fi
          if [ -z "$BACKUP_ENCRYPTION_PASSWORD" ]; then
            echo "::error::Missing repository secret BACKUP_ENCRYPTION_PASSWORD"
            exit 1
          fi

      - name: Create encrypted PostgreSQL 17 archive (public + private schemas)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p backup

          python3 - <<'PY'
          import os
          import subprocess
          from urllib.parse import urlsplit, unquote

          raw = os.environ["SUPABASE_DB_URL"]
          parsed = urlsplit(raw)
          if parsed.scheme not in ("postgres", "postgresql"):
              raise SystemExit("SUPABASE_DB_URL must start with postgresql://")
          if not parsed.hostname or not parsed.username or parsed.password is None:
              raise SystemExit("SUPABASE_DB_URL is missing host, username, or password")
          if not parsed.path or parsed.path == "/":
              raise SystemExit("SUPABASE_DB_URL is missing database name")

          host = parsed.hostname.lower()
          username = unquote(parsed.username)
          database = unquote(parsed.path.lstrip("/"))
          port = parsed.port or 5432
          username_placeholder_markers = ("region", "project_ref", "your-project", "placeholder", "example")
          if "aws-0-region" in host:
              raise SystemExit("The SUPABASE_DB_URL host is still the example aws-0-region pooler placeholder. Replace only the host with the exact Session pooler host shown in Supabase Connect.")
          if any(marker in host for marker in ("your-project", "placeholder", "example")):
              raise SystemExit("The SUPABASE_DB_URL host contains an example placeholder. Copy the exact Session pooler host from Supabase Connect.")
          if any(marker in username.lower() for marker in username_placeholder_markers):
              raise SystemExit("The SUPABASE_DB_URL username contains an example placeholder. Use the database username shown in Supabase Connect.")

          # Supabase shared pooler usernames include the project ref.
          if host.endswith(".pooler.supabase.com") and username == "postgres":
              username = "postgres.gfoaubfilhttnwjykaox"
              print("Normalized the Supabase shared pooler username with the DigiArz project ref.")
          if host.endswith(".pooler.supabase.com") and port != 5432:
              raise SystemExit("Use the Supabase Session pooler on port 5432 for pg_dump backups.")

          child_env = os.environ.copy()
          child_env.update({
              "PGHOST": host,
              "PGPORT": str(port),
              "PGUSER": username,
              "PGPASSWORD": unquote(parsed.password),
              "PGDATABASE": database,
              "PGSSLMODE": "require",
          })
          result = subprocess.run([
              "docker", "run", "--rm",
              "--env", "PGHOST", "--env", "PGPORT", "--env", "PGUSER",
              "--env", "PGPASSWORD", "--env", "PGDATABASE", "--env", "PGSSLMODE",
              "--volume", f"{os.getcwd()}/backup:/backup",
              "postgres:17",
              "sh", "-ceu",
              'pg_dump --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname="$PGDATABASE" --schema=public --schema=private --exclude-table-data=private.crypto_assets_sync_requests --exclude-table-data=private.market_fx_sync_requests --exclude-table-data=private.market_price_sync_requests --format=custom --no-owner --file=/backup/digiarz-database.dump'
          ], env=child_env, capture_output=True, text=True)
          if result.returncode:
              diagnostic = (result.stderr or "").lower()
              if "password authentication failed" in diagnostic:
                  message = "PostgreSQL rejected the credentials. Verify the database password in the GitHub SUPABASE_DB_URL secret."
              elif "could not translate host name" in diagnostic or "name or service not known" in diagnostic:
                  message = "The database host could not be resolved. Verify the exact Session pooler host copied from Supabase Connect."
              elif "tenant or user not found" in diagnostic:
                  message = "Supabase pooler could not match the project and role. Verify the Session pooler host and username."
              else:
                  message = "PostgreSQL backup command failed. Verify the Supabase Session pooler connection settings."
              raise SystemExit(message)
          print("Database archive created; connection values were not written to GitHub environment files.")
          PY

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -pass env:BACKUP_ENCRYPTION_PASSWORD \
            -in backup/digiarz-database.dump \
            -out backup/digiarz-database.dump.enc

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:BACKUP_ENCRYPTION_PASSWORD \
            -in backup/digiarz-database.dump.enc \
            -out /tmp/digiarz-database-verify.dump

          cmp backup/digiarz-database.dump /tmp/digiarz-database-verify.dump
          docker run --rm \
            --volume "$PWD/backup:/backup:ro" \
            postgres:17 \
            pg_restore --list /backup/digiarz-database.dump >/tmp/digiarz-archive-list.txt

          grep -q 'SCHEMA - public' /tmp/digiarz-archive-list.txt
          grep -q 'SCHEMA - private' /tmp/digiarz-archive-list.txt
          grep -q 'TABLE DATA public.' /tmp/digiarz-archive-list.txt
          grep -q 'TABLE private admin_users' /tmp/digiarz-archive-list.txt
          grep -q 'TABLE DATA private admin_users' /tmp/digiarz-archive-list.txt
          ! grep -q 'TABLE DATA private crypto_assets_sync_requests' /tmp/digiarz-archive-list.txt
          ! grep -q 'TABLE DATA private market_fx_sync_requests' /tmp/digiarz-archive-list.txt
          ! grep -q 'TABLE DATA private market_price_sync_requests' /tmp/digiarz-archive-list.txt

          {
            echo "Created (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Database client: $(docker run --rm postgres:17 pg_dump --version)"
            echo "Scope: PostgreSQL public + private schemas. Private request-queue table structures are included; transient queue rows are intentionally excluded. Private admin, audit, and control/state table data are included."
            echo "Format: PostgreSQL custom archive, encrypted with AES-256-CBC + PBKDF2"
            echo "Integrity: encryption/decryption byte comparison and pg_restore archive-list checks passed. This is archive integrity validation, not a live restore drill."
            sha256sum backup/digiarz-database.dump.enc
          } > backup/README-backup.txt

          rm -f backup/digiarz-database.dump /tmp/digiarz-database-verify.dump
          test -s backup/digiarz-database.dump.enc
          test ! -e backup/digiarz-database.dump

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiArz-database-backup
          path: backup/
          if-no-files-found: error
          retention-days: 7
